name: Build
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
jobs:
  linux-builds:
    name: "linux build"
    runs-on: ubuntu-latest
    steps:
      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
        id: go

      - name: "Check out code"
        uses: actions/checkout@v4

      - name: "build"
        run: |
          go build ./...

      - name: "test"
        run: |
          go test ./...
